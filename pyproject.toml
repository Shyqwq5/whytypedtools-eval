[project]
name = "whytypedtools-eval"
version = "0.1.0"
description = "GitHub tools over MCP, a minimal agent, and an eval suite for tool-use success and safety."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cohere>=7.2.0",
    "httpx>=0.27",
    "jq>=1.12.0",
    "mcp>=2.2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whytypedtools_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
